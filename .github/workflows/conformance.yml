# Official MCP conformance suite against the fixture server — the client-side
# gate for the 2026-07-28 modern era (the Inspector workflow covers the legacy
# era). Production clients now speak the modern era too; this suite stays the
# reference client that CI can run.
name: Conformance

on:
  push:
    branches: [main]
  pull_request:

# The suite evolves with the spec; pin to the commit the assertions below were
# calibrated against and bump deliberately (scores are ratios — new scenarios
# move the denominator).
env:
  CONFORMANCE_REF: 96a6f9478b7f2e125cf0360a213383cf57533893

jobs:
  conformance:
    name: MCP conformance (modern era)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build the conformance suite
        run: |
          git clone https://github.com/modelcontextprotocol/conformance.git /tmp/conformance
          cd /tmp/conformance
          git checkout "$CONFORMANCE_REF"
          npm ci
          npm run build

      - name: Instantiate the package
        run: julia --project -e 'using Pkg; Pkg.instantiate()'

      - name: Start the fixture server
        run: |
          julia --project dev/conformance/fixture_server.jl 8791 > fixture.log 2>&1 &
          echo $! > fixture.pid
          # Case-insensitive: the reliably-flushed readiness line is HTTP.jl's
          # stderr "Listening on:" (the script's stdout println can lag behind
          # buffering). Cold-cache CI spends ~2min in JIT before binding, so
          # the window is generous.
          for i in $(seq 1 300); do
            grep -qi "listening" fixture.log && break
            sleep 1
          done
          grep -qi "listening" fixture.log || { cat fixture.log; exit 1; }

      - name: Run the conformance suites
        run: |
          set -eo pipefail
          # Each run writes the runner's output to a file and checks two things:
          # the runner's exit status is the expected one, and its summary line
          # matches IN FULL. So a crash after a good summary, a run that printed
          # nothing, and a summary that merely contains the expected text all
          # fail the job. Assertions read the file, never a pipe from `echo`
          # (under pipefail a matcher that exits early would fail the producer).
          fail=0
          run() {  # run <expected exit status> <runner arguments...>
            local want=$1; shift
            local got=0
            node /tmp/conformance/dist/index.js server "$@" --url http://127.0.0.1:8791/ > raw.txt 2>&1 || got=$?
            sed 's/\x1b\[[0-9;]*m//g' raw.txt > out.txt
            cat out.txt
            [ "$got" = "$want" ] || { echo "::error::conformance runner exited $got (want $want)"; fail=1; }
          }
          want_line() {  # want_line <exact line> <what regressed>
            grep -qxF -- "$1" out.txt || { echo "::error::$2 (want the line: $1)"; fail=1; }
          }

          echo "::group::modern-dated (2026-07-28)"
          run 0 --spec-version 2026-07-28
          want_line "Total: 41 passed, 0 failed" "modern-dated regressed"
          echo "::endgroup::"

          # The frozen 2026-07-28 requirement set: the core scenarios, the 14
          # MRTR input-required-result-* scenarios, and (run but not scored)
          # the tasks-* extension, JSON Schema 2020-12 and header scenarios.
          # Note: tasks-status-notifications is SKIPPED by the suite at this
          # pin, so "0 failing" says nothing about notification delivery; the
          # package's own tests cover that.
          echo "::group::requirements (2026-07-28)"
          run 0 --requirements 2026-07-28
          want_line "Total: 196 passed, 0 failed" "requirement set regressed"
          want_line "Not scored for 2026-07-28: 13 scenario(s) run, 0 failing. These do not affect conformance." "a not-scored scenario (tasks-*, json-schema, headers) is failing or the set changed"
          echo "::endgroup::"

          # Per-scenario floors for the suites the totals above could mask if
          # the requirement set is ever re-cut upstream.
          echo "::group::server-stateless"
          run 0 --suite draft --scenario server-stateless
          want_line "Passed: 30/30, 0 failed, 0 warnings" "server-stateless regressed"
          echo "::endgroup::"

          echo "::group::http-header-validation"
          run 0 --suite draft --scenario http-header-validation
          want_line "Passed: 14/14, 0 failed, 0 warnings" "header-validation regressed"
          echo "::endgroup::"

          echo "::group::http-custom-header-server-validation"
          run 0 --suite draft --scenario http-custom-header-server-validation
          want_line "Passed: 10/10, 0 failed, 0 warnings" "custom-header validation regressed"
          echo "::endgroup::"

          exit $fail

      - name: Stop the fixture server
        if: always()
        run: kill "$(cat fixture.pid)" 2>/dev/null || true
