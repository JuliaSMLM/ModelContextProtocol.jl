# Official MCP conformance suite against the fixture server — the client-side
# gate for the 2026-07-28 modern era (the Inspector workflow covers the legacy
# era). Production clients now speak the modern era too; this suite stays the
# reference client that CI can run.
name: Conformance

on:
  push:
    branches: [main]
  pull_request:

# The suite evolves with the spec; pin to the commit the assertions below were
# calibrated against and bump deliberately (scores are ratios — new scenarios
# move the denominator).
env:
  CONFORMANCE_REF: 96a6f9478b7f2e125cf0360a213383cf57533893

jobs:
  conformance:
    name: MCP conformance (modern era)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build the conformance suite
        run: |
          git clone https://github.com/modelcontextprotocol/conformance.git /tmp/conformance
          cd /tmp/conformance
          git checkout "$CONFORMANCE_REF"
          npm ci
          npm run build

      - name: Instantiate the package
        run: julia --project -e 'using Pkg; Pkg.instantiate()'

      - name: Start the fixture server
        run: |
          julia --project dev/conformance/fixture_server.jl 8791 > fixture.log 2>&1 &
          echo $! > fixture.pid
          # Case-insensitive: the reliably-flushed readiness line is HTTP.jl's
          # stderr "Listening on:" (the script's stdout println can lag behind
          # buffering). Cold-cache CI spends ~2min in JIT before binding, so
          # the window is generous.
          for i in $(seq 1 300); do
            grep -qi "listening" fixture.log && break
            sleep 1
          done
          grep -qi "listening" fixture.log || { cat fixture.log; exit 1; }

      - name: Run the conformance suites
        run: |
          set -eo pipefail
          # The runner exits nonzero when a scenario fails, so captures
          # neutralize the exit status and every assertion below REQUIRES the
          # runner's final summary line: a crashed run that printed no summary
          # can never go green.
          run() { node /tmp/conformance/dist/index.js server "$@" --url http://127.0.0.1:8791/ 2>&1 | sed 's/\x1b\[[0-9;]*m//g' || true; }
          fail=0

          echo "::group::modern-dated (2026-07-28)"
          out=$(run --spec-version 2026-07-28); echo "$out"
          echo "$out" | grep -q "Total: 41 passed, 0 failed" || { echo "::error::modern-dated regressed (want 41/41)"; fail=1; }
          echo "::endgroup::"

          # The frozen 2026-07-28 requirement set: the core scenarios, the 14
          # MRTR input-required-result-* scenarios, and (run but not scored)
          # the tasks-* extension, JSON Schema 2020-12 and header scenarios.
          # One scenario is expected to fail until prompts can ask for input:
          # input-required-result-non-tool-request (prompts/get returning an
          # InputRequiredResult). Any other failing scenario, or a changed
          # total, fails the job; when that scenario starts passing, tighten
          # the expected total to "194 passed, 0 failed".
          echo "::group::requirements (2026-07-28)"
          out=$(run --requirements 2026-07-28); echo "$out"
          echo "$out" | grep -q "Total: 193 passed, 1 failed" || { echo "::error::requirement set changed (want 193 passed, 1 failed)"; fail=1; }
          failing=$(echo "$out" | { grep -E "^✗ " || true; } | sed -E 's/^✗ ([^:]+):.*/\1/' | sort | tr '\n' ' ')
          [ "$failing" = "input-required-result-non-tool-request " ] || { echo "::error::unexpected failing scenarios: $failing"; fail=1; }
          echo "$out" | grep -qE "Not scored for 2026-07-28: [0-9]+ scenario\(s\) run, 0 failing" || { echo "::error::a not-scored scenario (tasks-*, json-schema, headers) is failing"; fail=1; }
          echo "::endgroup::"

          # Per-scenario floors for the suites the totals above could mask if
          # the requirement set is ever re-cut upstream.
          echo "::group::server-stateless"
          out=$(run --suite draft --scenario server-stateless); echo "$out"
          echo "$out" | grep -q "Passed: 30/30" || { echo "::error::server-stateless regressed (want 30/30)"; fail=1; }
          echo "::endgroup::"

          echo "::group::http-header-validation"
          out=$(run --suite draft --scenario http-header-validation); echo "$out"
          echo "$out" | grep -q "Passed: 14/14" || { echo "::error::header-validation regressed (want 14/14)"; fail=1; }
          echo "::endgroup::"

          echo "::group::http-custom-header-server-validation"
          out=$(run --suite draft --scenario http-custom-header-server-validation); echo "$out"
          echo "$out" | grep -q "Passed: 10/10" || { echo "::error::custom-header validation regressed (want 10/10)"; fail=1; }
          echo "::endgroup::"

          exit $fail

      - name: Stop the fixture server
        if: always()
        run: kill "$(cat fixture.pid)" 2>/dev/null || true
