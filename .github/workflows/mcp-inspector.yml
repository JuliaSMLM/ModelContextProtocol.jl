name: MCP Inspector Tests
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

# GitHub's implicit default for `run:` is `bash -e`, which has NO pipefail: in a
# pipeline like `... | julia ... | tail -1`, a crash mid-pipeline is masked by the
# exit status of the last command. `shell: bash` makes GitHub invoke `bash -eo pipefail`.
defaults:
  run:
    shell: bash

env:
  # The Inspector is pinned via .github/inspector/package-lock.json and invoked from
  # node_modules — never `npx @modelcontextprotocol/inspector`. An unpinned npx call is
  # what broke this workflow: Inspector 2.0.0 shipped and every job started failing with
  # no change on our side.
  INSPECTOR: .github/inspector/node_modules/.bin/mcp-inspector
  MCP_CONFIG: .github/inspector/mcp-servers.json
  ASSERT: .github/inspector/assert-json.sh

jobs:
  inspector-stdio:
    name: Test stdio servers with MCP Inspector
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'

      - uses: julia-actions/cache@v3

      # Inspector 2.0 requires Node >= 22.19.0. Without this step the job silently used
      # whatever Node the runner image happened to ship, which is free to change.
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: .github/inspector/package-lock.json

      - name: Install pinned MCP Inspector
        working-directory: .github/inspector
        run: npm ci

      # Read the pinned versions from the manifest rather than asking the binary:
      # `mcp-inspector --version` is not a version flag — it BOOTS the inspector and
      # blocks until killed, which would hang the job until the step timeout.
      - name: Report toolchain versions
        run: |
          node --version
          jq --version
          jq -r '.devDependencies | to_entries[] | "\(.key) \(.value)"' .github/inspector/package.json

      - name: Build Julia package
        run: |
          julia --project -e 'using Pkg; Pkg.instantiate()'
          julia --project -e 'using Pkg; Pkg.precompile()'

      # Every Inspector call below uses `--config`/`--server` rather than passing the
      # launch command inline. Inspector 2.0's CLI stops collecting the target at the
      # first dashed token, so `julia --project=... server.jl` loses its arguments; the
      # server definition lives in .github/inspector/mcp-servers.json instead.
      # `--format json` emits a single JSON object on stdout with no banners — note it
      # nests the payload under `.result`, hence the `.result.` prefixes below.
      - name: Test tools with Inspector CLI
        run: |
          "$INSPECTOR" --cli --config "$MCP_CONFIG" --server time --format json \
            --method tools/list > tools_output.json
          "$ASSERT" tools_output.json 'any(.result.tools[]; .name == "current_time")' 'tools/list has current_time'

          "$INSPECTOR" --cli --config "$MCP_CONFIG" --server time --format json \
            --method tools/call --tool-name current_time > tool_call.json
          "$ASSERT" tool_call.json '.result.content[0].text | test("Current time")' 'tools/call current_time'
          "$ASSERT" tool_call.json '.result.isError == false' 'tools/call not an error'

      - name: Test resources with Inspector CLI
        run: |
          "$INSPECTOR" --cli --config "$MCP_CONFIG" --server time --format json \
            --method resources/list > resources.json
          "$ASSERT" resources.json \
            'any(.result.resources[]; .uri == "character-info://harry-potter/birthday")' \
            'resources/list has the birthday resource'

          "$INSPECTOR" --cli --config "$MCP_CONFIG" --server time --format json \
            --method resources/read --uri "character-info://harry-potter/birthday" > resource_read.json
          "$ASSERT" resource_read.json \
            '.result.contents[0].uri == "character-info://harry-potter/birthday" and (.result.contents[0].text | test("July 31"))' \
            'resources/read returns the birthday contents'

      - name: Test prompts with Inspector CLI
        run: |
          "$INSPECTOR" --cli --config "$MCP_CONFIG" --server time --format json \
            --method prompts/list > prompts.json
          "$ASSERT" prompts.json \
            'any(.result.prompts[]; .name == "greeting") and any(.result.prompts[]; .name == "movie_analysis")' \
            'prompts/list has greeting and movie_analysis'

          "$INSPECTOR" --cli --config "$MCP_CONFIG" --server time --format json \
            --method prompts/get --prompt-name greeting > greeting_prompt.json
          "$ASSERT" greeting_prompt.json '.result.messages[0].content.text | length > 0' 'prompts/get greeting'

          # Prompt arguments DO work through the Inspector CLI (flag is --prompt-args,
          # plural). The previous claim that they were broken is why this was only ever
          # covered by the raw JSON-RPC step below.
          "$INSPECTOR" --cli --config "$MCP_CONFIG" --server time --format json \
            --method prompts/get --prompt-name movie_analysis \
            --prompt-args genre="science fiction" year=1980 > prompt_args.json
          "$ASSERT" prompt_args.json \
            '.result.messages[0].content.text | test("science fiction") and test("1980")' \
            'prompts/get with arguments'

      # Keeps one client-library-free path: raw JSON-RPC straight into the server over
      # stdio, asserting the wire response with no Inspector in the middle.
      - name: Test prompts with arguments using direct JSON-RPC
        run: |
          cat > /tmp/prompt_test1.jsonl << 'JSONRPC'
          {"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"test","version":"1.0"}},"id":1}
          {"jsonrpc":"2.0","method":"prompts/get","params":{"name":"movie_analysis","arguments":{"genre":"science fiction"}},"id":2}
          JSONRPC

          # Strip the heredoc's leading indentation; leading whitespace breaks the JSON.
          sed 's/^[[:space:]]*//' /tmp/prompt_test1.jsonl | \
            julia --project=. examples/time_server.jl 2>/dev/null | \
            tail -1 > prompt_with_args.json
          "$ASSERT" prompt_with_args.json \
            '.result.messages[0].content.text | test("science fiction")' \
            'direct JSON-RPC prompts/get with required argument'

          cat > /tmp/prompt_test2.jsonl << 'JSONRPC'
          {"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"test","version":"1.0"}},"id":1}
          {"jsonrpc":"2.0","method":"prompts/get","params":{"name":"movie_analysis","arguments":{"genre":"horror","year":"1980"}},"id":3}
          JSONRPC

          sed 's/^[[:space:]]*//' /tmp/prompt_test2.jsonl | \
            julia --project=. examples/time_server.jl 2>/dev/null | \
            tail -1 > prompt_full_args.json
          "$ASSERT" prompt_full_args.json \
            '.result.messages[0].content.text | test("horror") and test("1980")' \
            'direct JSON-RPC prompts/get with all arguments'

  inspector-http:
    name: Test HTTP servers with MCP Inspector
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'

      - uses: julia-actions/cache@v3

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: .github/inspector/package-lock.json

      - name: Install pinned MCP Inspector
        working-directory: .github/inspector
        run: npm ci

      - name: Build Julia package
        run: |
          julia --project -e 'using Pkg; Pkg.instantiate()'
          julia --project -e 'using Pkg; Pkg.precompile()'

      # Primary HTTP coverage: the Inspector speaks Streamable HTTP natively, so this
      # exercises our transport directly with no bridge process in between.
      - name: Test HTTP server natively
        run: |
          julia --project=. examples/simple_http_server.jl &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          .github/inspector/wait-http.sh http://127.0.0.1:3000/ "$SERVER_PID"

          "$INSPECTOR" --cli --config "$MCP_CONFIG" --server http --format json \
            --method tools/list > http_tools.json
          "$ASSERT" http_tools.json 'any(.result.tools[]; .name == "echo")' 'HTTP tools/list has echo'

          "$INSPECTOR" --cli --config "$MCP_CONFIG" --server http --format json \
            --method tools/call --tool-name echo --tool-arg message=hello > http_call.json
          "$ASSERT" http_call.json '.result.content[0].text | test("hello")' 'HTTP tools/call echo'

      # Secondary coverage: the same server through the mcp-remote bridge, because that
      # is the path this repo's docs tell users to configure for Claude Desktop. Pinned
      # in the same lockfile, and it must pass — it used to be `|| true`.
      - name: Test HTTP server via mcp-remote bridge (Claude Desktop path)
        run: |
          julia --project=. examples/simple_http_server.jl &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          .github/inspector/wait-http.sh http://127.0.0.1:3000/ "$SERVER_PID"

          "$INSPECTOR" --cli --config "$MCP_CONFIG" --server http-bridge --format json \
            --method tools/list > bridge_tools.json
          "$ASSERT" bridge_tools.json 'any(.result.tools[]; .name == "echo")' 'bridge tools/list has echo'

      - name: Direct HTTP API test
        run: |
          julia --project=. examples/simple_http_server.jl &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          .github/inspector/wait-http.sh http://127.0.0.1:3000/ "$SERVER_PID"

          curl -X POST http://127.0.0.1:3000/ \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2025-11-25' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"test","version":"1.0"}},"id":1}' \
            -s -o init.json -D headers.txt
          "$ASSERT" init.json '.result.serverInfo.name | length > 0' 'initialize returns serverInfo'
          "$ASSERT" init.json '.result.protocolVersion == "2025-11-25"' 'initialize negotiates 2025-11-25'

          # A missing session id used to skip the rest of this step silently.
          SESSION_ID=$(grep -i "mcp-session-id" headers.txt | cut -d' ' -f2 | tr -d '\r')
          if [ -z "$SESSION_ID" ]; then
            echo "no Mcp-Session-Id header returned by initialize"
            cat headers.txt
            exit 1
          fi
          echo "Session ID: $SESSION_ID"

          curl -X POST http://127.0.0.1:3000/ \
            -H 'Content-Type: application/json' \
            -H "Mcp-Session-Id: $SESSION_ID" \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","method":"tools/list","params":{},"id":2}' \
            -s -o http_direct_tools.json
          "$ASSERT" http_direct_tools.json 'any(.result.tools[]; .name == "echo")' 'direct HTTP tools/list has echo'
